<form class="filters" method="get" id="filters"><label>Line<select name="line"><option value="">All lines</option>{% for item in lines %}<option value="{{ item.pk }}" {% if request.GET.line == item.pk|stringformat:'s' %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>Product<select name="product"><option value="">All products</option>{% for item in products %}<option value="{{ item.pk }}" {% if request.GET.product == item.pk|stringformat:'s' %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>Model<select name="model"><option value="">All models</option>{% for item in model_names %}<option {% if request.GET.model == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>Reporting month<input type="month" name="month" value="{{ month }}" required></label>{% if screen == 'line-metrics' %}<label>View<select name="period"><option value="month">Month</option><option value="quarter" {% if request.GET.period == 'quarter' %}selected{% endif %}>Quarter</option><option value="week" {% if request.GET.period == 'week' %}selected{% endif %}>Week</option></select></label><label>Week grouping<select name="grouping"><option value="excel">Excel W1–W5</option><option value="calendar" {% if request.GET.grouping == 'calendar' %}selected{% endif %}>Calendar Mon–Sun</option></select></label><label>Week<select name="week">{% for w in '12345' %}<option value="{{ w }}" {% if request.GET.week == w %}selected{% endif %}>W{{ w }}</option>{% endfor %}</select></label>{% endif %}<button class="primary" type="submit">Apply filters ↗</button></form>
